name: family_finance
description: Shared family ledger — budgets, goals, and confirmed transactions.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Localization & money formatting
  intl: any
  shared_preferences: ^2.5.3

  # Navigation & state
  go_router: ^16.2.1
  provider: ^6.1.5

  # Firebase (wire real project with: flutterfire configure)
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  cloud_firestore: ^6.0.1
  cloud_functions: ^6.0.1
  firebase_messaging: ^16.0.1
  firebase_remote_config: ^6.0.1

  # Auth providers
  google_sign_in: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
